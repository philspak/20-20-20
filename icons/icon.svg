<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b2b"/>
      <stop offset="100%" stop-color="#15324b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78b7e5"/>
      <stop offset="100%" stop-color="#42b883"/>
    </linearGradient>
    <linearGradient id="iris-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78b7e5"/>
      <stop offset="100%" stop-color="#2a75ad"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Outer subtle 20-feet distance ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#29445d" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#78b7e5" stroke-width="2" opacity="0.3"/>

  <!-- Stylized Eye Outline -->
  <path d="M 96 256 C 140 160 372 160 416 256 C 372 352 140 352 96 256 Z" 
        fill="none" 
        stroke="url(#accent-grad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#soft-glow)"/>

  <!-- Iris -->
  <circle cx="256" cy="256" r="76" fill="url(#iris-grad)"/>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="38" fill="#091b2b"/>

  <!-- Eye Highlight / Catchlight -->
  <circle cx="236" cy="236" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="274" cy="274" r="6" fill="#ffffff" opacity="0.7"/>

  <!-- Subtle 20-20-20 accent text badge -->
  <g transform="translate(256, 440)" text-anchor="middle">
    <rect x="-80" y="-20" width="160" height="30" rx="15" fill="#10283c" stroke="#29445d" stroke-width="2"/>
    <text x="0" y="2" fill="#78b7e5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2">20 · 20 · 20</text>
  </g>
</svg>
